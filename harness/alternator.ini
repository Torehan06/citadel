# Minimal pytest config for Scylla's Alternator tests when pointed at Citadel.
# (Their own test/pytest.ini pulls in Scylla CI plugins we don't need.)
[pytest]
# DynamoDB-correct behaviour that Scylla marks xfail should count as a pass here.
xfail_strict = false
norecursedirs = manual perf lib pylib_test
filterwarnings =
    ignore::DeprecationWarning
