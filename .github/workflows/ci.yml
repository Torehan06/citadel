# Build and unit-test on all three region platforms: darwin/arm64 (tuchanka-1),
# linux/arm64 (palaven-1), linux/amd64 (thessia-1). Free for public repos.
name: ci
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
